name: Static SEO quality gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependency
        run: python -m pip install 'defusedxml>=0.7.1,<1'
      - name: Run SEO pipeline tests
        run: python -m unittest discover -s tests -v
      - name: Validate pages, metadata, sitemap and language alternates
        run: python scripts/seo_pipeline.py
